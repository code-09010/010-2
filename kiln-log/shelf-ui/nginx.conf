server {
    listen 80;
    server_name _;

    # 接口转给 fire-api 容器，页面和接口同源，不用处理跨域
    location /api/ {
        proxy_pass http://fire-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
